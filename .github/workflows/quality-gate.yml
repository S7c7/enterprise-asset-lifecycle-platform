name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and asset tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile all backend modules
        run: mvn -B -pl ruoyi-admin -am -DskipTests package

      - name: Run asset domain tests
        run: mvn -B -pl ruoyi-modules/ruoyi-asset -am -DskipTests=false test

  frontend:
    name: Frontend asset quality and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint asset domain
        run: pnpm exec eslint src/views/asset src/api/asset

      - name: Type-check asset domain
        run: pnpm typecheck:asset

      - name: Build production bundle
        run: pnpm build:prod
